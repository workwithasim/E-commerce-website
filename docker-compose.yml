version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: cheezious_postgres
    restart: always
    environment:
      POSTGRES_USER: cheezious
      POSTGRES_PASSWORD: cheezious_secret
      POSTGRES_DB: cheezious_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheezious -d cheezious_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cheezious-network

  # 2. Node.js + Express + Prisma + WebSockets Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cheezious_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://cheezious:cheezious_secret@db:5432/cheezious_db?schema=public"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cheezious-network

  # 3. React Frontend + Nginx Reverse Proxy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cheezious_frontend
    restart: always
    ports:
      - "80:80"
      - "8085:80"
    depends_on:
      - server
    networks:
      - cheezious-network

volumes:
  pgdata:

networks:
  cheezious-network:
    driver: bridge
